services:

  mysql:
    image: mysql:8
    container_name: mysql-tareas

    environment:
      MYSQL_DATABASE: tareasdb
      MYSQL_USER: usuario
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: